services:

  postgres:
    image: postgres:17
    container_name: cencom-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: cencom_admin
      POSTGRES_PASSWORD: CENCOM_DB_ChangeMe_2026
      POSTGRES_DB: cencom_identity

    ports:
      - "5432:5432"

    volumes:
      - "D:/CENCOM/SYSTEM/IDENTITY/database:/var/lib/postgresql/data"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cencom_admin -d cencom_identity"]
      interval: 10s
      timeout: 5s
      retries: 5